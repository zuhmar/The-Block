services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: street
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: street
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["street-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U street"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  street-data:
